name: Refresh RPS Fleet Dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rps-fleet-refresh.yml"
      - "scripts/fix_dashboard_encoding.py"
      - "scripts/set_puerto_rico_time.py"
      - "scripts/build_dashboard.py"
      - "scripts/fetch_skytrackit.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: rps-fleet-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SKYTRACKIT_USER: ${{ secrets.SKYTRACKIT_USER }}
      SKYTRACKIT_PASSWORD: ${{ secrets.SKYTRACKIT_PASSWORD }}
      SKYTRACKIT_LOOKBACK_DAYS: "8"
      SKYTRACKIT_RETRIES: "3"
      SKYTRACKIT_BACKOFF_SECONDS: "5"
      SKYTRACKIT_MAX_SECONDS: "480"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch SkyTrackIt data
        run: python scripts/fetch_skytrackit.py

      - name: Rebuild dashboard
        run: python scripts/build_dashboard.py

      - name: Repair encoding and navigation
        run: python scripts/fix_dashboard_encoding.py

      - name: Set timestamps to Puerto Rico time
        run: python scripts/set_puerto_rico_time.py

      - name: Commit and push dashboard changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rps-dashboard-bot"
          git config user.email "dashboard@rpsmedical.com"
          FILES="index.html dashboard_data.json dashboard_interactivo_resumen.csv dashboard_interactivo_rutas.csv"
          git add $FILES
          if git diff --cached --quiet; then
            echo "No dashboard changes to publish."
            exit 0
          fi
          git commit -m "Refresh fleet dashboard data"
          # main moves under us: another refresh run, or a human commit. Replay
          # the generated files onto the new tip instead of failing the job.
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); replaying onto current origin/main."
            git fetch origin main
            git reset --soft FETCH_HEAD
            git add $FILES
            if git diff --cached --quiet; then
              echo "Another run already published equivalent data."
              exit 0
            fi
            git commit -m "Refresh fleet dashboard data"
          done
          echo "Could not push dashboard changes after 3 attempts." >&2
          exit 1
